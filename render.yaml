services:
  - type: web
    name: wisemouth-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wisemouth-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://wise-mouth.vercel.app (no trailing slash)
      - key: CORS_ORIGIN_REGEX
        sync: false # optional, for Vercel previews: https://wise-mouth.*\.vercel\.app
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: wisemouth-db
    plan: free
